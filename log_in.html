<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soo Gal - Iskuul SMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans antialiased">

    <div class="w-full max-w-md mx-4">
        <div class="text-center mb-6">
            <div class="inline-flex p-4 bg-indigo-600 text-white rounded-2xl shadow-lg mb-3">
                <i class="fa-solid fa-school text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Ku Soo Dhowaw Iskuul SMS</h1>
            <p class="text-sm text-slate-500 mt-1">Geli aqoonsigaaga si aad u gasho nidaamka</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200">
            <div id="error-message" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Username/Email ama password-ka waa khalad!
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Username ama E-mail</label>
                    <div class="relative">
                        <input type="text" id="user-identity" placeholder="Tusaale: ADM_xasan01 ama email" required class="w-full border rounded-xl p-3 pl-10 text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                        <i class="fa-solid fa-user-shield absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Erayga Sirta ah (Password)</label>
                    <div class="relative">
                        <input type="password" id="user-password" placeholder="••••••••" required class="w-full border rounded-xl p-3 pl-10 text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-medium text-sm hover:bg-indigo-700 transition flex items-center justify-center space-x-2 shadow-md">
                    <span>Soo Gal (Log In)</span>
                    <i class="fa-solid fa-right-to-bracket text-xs"></i>
                </button>
            </form>

            <div class="text-center mt-6 pt-4 border-t border-slate-100 text-sm text-slate-500">
                Weli akoon ma lihid? <a href="register.html" class="text-indigo-600 font-semibold hover:underline">Isdiiwaan geli halkan</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const identity = document.getElementById("user-identity").value.trim();
            const password = document.getElementById("user-password").value;
            const errorDiv = document.getElementById("error-message");
            
            errorDiv.classList.add("hidden");
            let loginSuccess = false;
            let targetDashboard = "";

            // 1. Hubi Akoonnada Default-ka ah haddii lagu soo galo Username-ka cusub ama Email
            if ((identity === "ADM_xasan01" || identity === "admin@sms.com") && password === "admin123") {
                loginSuccess = true;
                targetDashboard = "admin-dashboard.html";
            } else if ((identity === "TECH_xaashi001" || identity === "teacher@sms.com") && password === "teacher123") {
                loginSuccess = true;
                targetDashboard = "teacher-dashboard.html";
            } else if ((identity === "STD_cumar0001" || identity === "student@sms.com") && password === "student123") {
                loginSuccess = true;
                targetDashboard = "student-dashboard.html";
            } else {
                // 2. Haddii kale, ka raadi LocalStorage dadka iska diiwaan geliyay register.html
                const savedUsers = JSON.parse(localStorage.getItem("sms_registered_users")) || [];
                // Nidaamku wuxuu ka raadinayaa dhinaca Username-ka iyo dhinaca Email-kaba
                const matchedUser = savedUsers.find(u => (u.username === identity || u.email.toLowerCase() === identity.toLowerCase()) && u.password === password);
                
                if (matchedUser) {
                    loginSuccess = true;
                    targetDashboard = matchedUser.role + "-dashboard.html"; // Weerarka tooska ah ee garashada role-ka
                }
            }

            // Haddii login-ku guulaysto u tuur boga dashboard-ka saxda ah
            if (loginSuccess && targetDashboard !== "") {
                window.location.replace(targetDashboard);
            } else {
                errorDiv.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
