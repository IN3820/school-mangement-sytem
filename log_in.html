<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — EduCore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="p-6 bg-slate-900 text-white text-center relative">
      <div class="w-16 h-16 rounded-xl bg-indigo-600 mx-auto flex items-center justify-center shadow-lg mb-3">
        <img src="logo.jpg" alt="Dugsi Kaab Logo" class="w-12 h-12 object-cover rounded-xl ">
      </div>
      <h3 class="font-display text-xl font-bold">Welcome Back</h3>
      <p class="text-slate-400 text-xs mt-1">Sign in to your Dugsi Kaab account</p>
    </div>

    <!-- Foomka Log In-ka oo leh dhacdo gudbin ah -->
<form onsubmit="gudbiDashboard(event)" class="p-6 md:p-8 space-y-5">
  <div>
    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Email Address</label>
    <input type="email" placeholder="username@dugsikaab.com" required
      class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition" />
  </div>

  <div>
    <div class="flex justify-between items-center mb-2">
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Password</label>
      <a href="#" class="text-xs text-indigo-600 font-medium hover:underline">Forgot password?</a>
    </div>
    <input type="password" placeholder="••••••••" required
      class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition" />
  </div>

  <div class="flex items-center">
    <input type="checkbox" id="remember" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500" />
    <label for="remember" class="ml-2 text-xs font-medium text-slate-500 cursor-pointer">Remember this device</label>
  </div>

  <!-- Badhankii asalka ahaa ee Log In oo sidiisii ah -->
  <button type="submit" 
    class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-lg shadow-indigo-100 transition-all duration-200">
    Sign In
  </button>

  <p class="text-center text-xs text-slate-500 pt-2">
    Don't have an account? <a href="registration.html" class="text-indigo-600 font-semibold hover:underline">Register here</a>
  </p>
</form>
  </div>

</body>

<script>
  function gudbiDashboard(event) {
    // Waxay celinaysaa in boggu refresh dhaco marka foomka la riixo
    event.preventDefault(); 
    
    // Halkan u qor magaca saxda ah ee faylkaaga Dashboard-ka (tusaale: index.html ama dashboard.html)
    window.location.href = "school_system.html"; 
  }
</script>

</html>
